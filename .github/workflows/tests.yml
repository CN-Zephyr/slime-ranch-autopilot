name: tests

on:
  push:
  pull_request:

jobs:
  unittest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: unit tests
        run: python -m unittest discover -s tests
      - name: syntax check
        run: python -m py_compile __init__.py core/main_controller.py core/real.py core/bridge.py core/ranch.py core/winio.py
